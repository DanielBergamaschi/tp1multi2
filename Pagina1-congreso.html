<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Congreso</title>

  <!-- P5JS -->

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/addons/p5.sound.min.js"></script>

  <!-- FUENTES -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- INTEL ONE MONO -->

  <link
    href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:wght@300;400;700&display=swap"
    rel="stylesheet"
  />

  <!-- IM FELL ENGLISH -->

  <link
    href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap"
    rel="stylesheet"
  />

  <style>

    @font-face{
      font-family:"BlueScreen";
      src:url("fuentes/blue_screen/Blue Screen Personal Use.ttf") format("truetype");
    }

    @font-face{
      font-family:"LedLight";
      src:url("fuentes/ledlight.otf") format("opentype");
    }

    @font-face{
      font-family:"FaithCollapsing";
      src:url("fuentes/faith_collapsing/Faith Collapsing.ttf") format("truetype");
    }

    @font-face{
      font-family:"Quake";
      src:url("fuentes/quake/dpquake_.ttf") format("truetype");
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      min-height:100vh;

      background:
        radial-gradient(circle at top, rgba(217,185,92,0.20), transparent 32%),
        radial-gradient(circle at bottom, rgba(90,133,255,0.14), transparent 34%),
        #030303;

      overflow:hidden;

      font-family:"Intel One Mono", monospace;

      display:flex;

      justify-content:center;

      align-items:center;
    }

    .container{

      position:relative;

      width:min(100vw,430px);

      height:min(100dvh,932px);

      min-height:720px;

      overflow:hidden;

      display:flex;

      justify-content:center;

      align-items:center;

      color:white;

      background:#050505;

      border:1px solid rgba(255,255,255,0.14);

      border-radius:34px;

      box-shadow:
        0 0 0 10px rgba(255,255,255,0.03),
        0 30px 80px rgba(0,0,0,0.70),
        0 0 95px rgba(222,181,77,0.18);
    }

    .container::before{

      content:"";

      position:absolute;

      inset:0;

      z-index:8;

      pointer-events:none;

      background:
        linear-gradient(115deg, transparent 0 25%, rgba(255,255,255,0.22) 28%, transparent 34%),
        radial-gradient(circle at 22% 12%, rgba(255,234,177,0.58), transparent 7%),
        radial-gradient(circle at 86% 35%, rgba(255,255,255,0.34), transparent 5%),
        radial-gradient(circle at 35% 82%, rgba(255,210,91,0.28), transparent 6%);

      mix-blend-mode:screen;

      opacity:0.64;

      animation:screen-glint 7s ease-in-out infinite;
    }

    .container::after{

      content:"";

      position:absolute;

      inset:0;

      z-index:9;

      pointer-events:none;

      background:linear-gradient(
        to bottom,
        rgba(255,255,255,0.045) 0,
        rgba(255,255,255,0.045) 1px,
        transparent 1px,
        transparent 5px
      );

      opacity:0.38;
    }

    @keyframes screen-glint {

      0%,100%{
        transform:translateX(-22px);
        opacity:0.42;
      }

      45%{
        transform:translateX(18px);
        opacity:0.82;
      }

      70%{
        opacity:0.35;
      }

    }

    /* VIDEO */

    video{

      position:absolute;

      width:100%;

      height:100%;

      object-fit:cover;

      opacity:0.52;
    }

    /* OSCURECER */

    .overlay{

      position:absolute;

      inset:0;

      background:
        linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.64)),
        radial-gradient(circle at center, transparent 0 38%, rgba(0,0,0,0.62) 78%);

      backdrop-filter:blur(1px);

      z-index:2;
    }

    /* CANVAS P5 */

    #canvasDiv{

      position:absolute;

      inset:0;

      z-index:3;

      pointer-events:none;
    }

    #iglesiaEffectDiv{

      position:absolute;

      inset:0;

      z-index:6;

      pointer-events:none;

      mix-blend-mode:screen;
    }

    canvas{
      display:block;
    }

    /* CONTENIDO */

    .content{

      position:relative;

      z-index:10;

      text-align:center;

      padding:28px 24px 34px;

      width:100%;

      max-width:390px;
    }

    .subtitle{

      color:#d7c492;

      text-transform:uppercase;

      letter-spacing:4px;

      margin-bottom:18px;

      font-size:11px;

      text-shadow:0 0 18px rgba(255,218,119,0.45);

      font-family:"LedLight", "Intel One Mono", monospace;
    }

    h1{

      font-size:58px;

      line-height:0.86;

      font-weight:900;

      text-transform:uppercase;

      letter-spacing:0;

      font-family:"FaithCollapsing", "IM Fell English", serif;

      text-shadow:
        0 0 14px rgba(255,255,255,0.34),
        0 0 42px rgba(218,178,73,0.42),
        0 0 80px rgba(93,162,255,0.20);
    }

    h1 span{

      display:block;

      color:#9a9a9a;
    }

    .description{

      max-width:330px;

      margin:auto;

      margin-top:30px;

      color:#d0d0d0;

      font-size:15px;

      line-height:1.55;

      text-shadow:0 0 12px rgba(0,0,0,0.88);

      font-family:"LedLight", "Intel One Mono", monospace;
    }

    .spark{

      position:absolute;

      z-index:7;

      width:5px;

      height:5px;

      border-radius:50%;

      background:#ffe7a1;

      box-shadow:
        0 0 8px #fff,
        0 0 20px rgba(255,218,121,0.9),
        0 0 42px rgba(255,218,121,0.55);

      animation:sparkle 2.9s ease-in-out infinite;
    }

    .random-spark{

      position:absolute;

      z-index:7;

      width:var(--spark-size, 4px);

      height:var(--spark-size, 4px);

      border-radius:50%;

      background:rgba(255,237,185,0.95);

      box-shadow:
        0 0 6px rgba(255,255,255,0.95),
        0 0 18px rgba(255,218,121,0.85),
        0 0 44px rgba(90,165,255,0.38);

      opacity:0;

      pointer-events:none;

      animation:randomSpark var(--spark-duration, 3s) ease-in-out infinite;
      animation-delay:var(--spark-delay, 0s);
    }

    .random-spark::before{

      content:"";

      position:absolute;

      top:50%;

      left:50%;

      width:calc(var(--spark-size, 4px) * 8);

      height:1px;

      background:linear-gradient(to right, transparent, rgba(255,255,255,0.85), transparent);

      transform:translate(-50%,-50%) rotate(var(--spark-angle, 0deg));
    }

    .spark::before,
    .spark::after{

      content:"";

      position:absolute;

      inset:50% auto auto 50%;

      width:28px;

      height:1px;

      background:linear-gradient(to right, transparent, rgba(255,255,255,0.9), transparent);

      transform:translate(-50%,-50%);
    }

    .spark::after{
      transform:translate(-50%,-50%) rotate(90deg);
    }

    @keyframes sparkle {

      0%,100%{
        transform:scale(0.35) rotate(0deg);
        opacity:0;
      }

      45%{
        transform:scale(1) rotate(22deg);
        opacity:1;
      }

      70%{
        transform:scale(0.6) rotate(40deg);
        opacity:0.35;
      }

    }

    @keyframes randomSpark {

      0%,100%{
        transform:scale(0.15);
        opacity:0;
      }

      12%{
        opacity:0;
      }

      28%{
        transform:scale(1.15);
        opacity:0.95;
      }

      43%{
        transform:scale(0.45);
        opacity:0.18;
      }

    }

    /* PALABRAS */

    .word{

      position:absolute;

      color:rgba(255,255,255,0.22);

      font-weight:900;

      text-transform:uppercase;

      letter-spacing:4px;

      white-space:nowrap;

      user-select:none;

      z-index:4;

      animation:float 18s ease-in-out infinite;

      text-shadow:
        0 0 10px rgba(255,255,255,0.30),
        0 0 24px rgba(255,221,147,0.34),
        0 0 48px rgba(74,148,255,0.16);

      opacity:0.86;
    }

    @keyframes float {

      0%{
        transform:translate(0px,0px) rotate(0deg);
      }

      20%{
        transform:translate(80px,-40px) rotate(1deg);
      }

      40%{
        transform:translate(-60px,30px) rotate(-1deg);
      }

      60%{
        transform:translate(40px,60px) rotate(1deg);
      }

      80%{
        transform:translate(-50px,-20px) rotate(-1deg);
      }

      100%{
        transform:translate(0px,0px) rotate(0deg);
      }

    }

    /* TABLET */

    @media(max-width:1024px){

      h1{
        font-size:58px;
      }

      .description{
        font-size:15px;
        padding:0 20px;
      }

      .word{
        font-size:22px !important;
      }

    }

    /* CELULAR */

    @media(max-width:768px){

      body{
        display:block;
      }

      .container{

        width:100vw;

        height:100dvh;

        min-height:100dvh;

        border:0;

        border-radius:0;

        box-shadow:none;
      }

      .subtitle{

        font-size:10px;

        letter-spacing:5px;
      }

      h1{

        font-size:50px;

        letter-spacing:-2px;
      }

      .description{

        font-size:15px;

        line-height:1.5;

        margin-top:25px;

        padding:0 10px;
      }

      .word{

        font-size:14px !important;

        letter-spacing:4px;
      }

    }

    @media(max-width:380px){

      h1{
        font-size:43px;
      }

      .description{
        font-size:13px;
      }

      .content{
        padding-inline:18px;
      }

    }

  </style>

</head>

<body>

  <!-- AUDIO -->

  <script>

    const wordFonts = ["BlueScreen", "LedLight", "FaithCollapsing", "Quake"];

    document.querySelectorAll(".word").forEach((word, index) => {

      word.style.fontFamily = `"${wordFonts[index % wordFonts.length]}", "Intel One Mono", monospace`;

    });

    const sparkField = document.getElementById("sparkField");

    for(let i = 0; i < 70; i++){

      const spark = document.createElement("span");

      spark.className = "random-spark";

      spark.style.left = `${Math.random() * 100}%`;
      spark.style.top = `${Math.random() * 100}%`;
      spark.style.setProperty("--spark-size", `${2 + Math.random() * 5}px`);
      spark.style.setProperty("--spark-delay", `${Math.random() * 5.5}s`);
      spark.style.setProperty("--spark-duration", `${1.8 + Math.random() * 3.8}s`);
      spark.style.setProperty("--spark-angle", `${Math.random() * 180}deg`);

      sparkField.appendChild(spark);

    }

    const video = document.getElementById("bg-video");

    document.body.addEventListener("click", async () => {

      video.muted = false;

      try{
        await video.play();
      }
      catch(err){
        console.log(err);
      }

    }, { once:true });

  </script>

  <script src="js/congreso-iglesia-efectos.js"></script>

  <!-- P5JS -->

  <script>

    let particles = [];

    function setup(){

      let canvas = createCanvas(windowWidth, windowHeight);

      canvas.parent("canvasDiv");

      for(let i = 0; i < 130; i++){

        particles.push({

          x: random(width),
          y: random(height),

          size: random(1,4.8),

          speedX: random(-0.3,0.3),
          speedY: random(-0.3,0.3)

        });

      }

    }

    function draw(){

      clear();

      noStroke();

      fill(255,230,170,30);

      for(let p of particles){

        circle(p.x,p.y,p.size);

        p.x += p.speedX;
        p.y += p.speedY;

        if(p.x > width) p.x = 0;
        if(p.x < 0) p.x = width;

        if(p.y > height) p.y = 0;
        if(p.y < 0) p.y = height;

      }

    }

    function windowResized(){

      resizeCanvas(windowWidth, windowHeight);

    }

  </script>
